<!doctype html>
<!--
  cutout-ad template — a working 8 s demo of every core piece with the example cast (R_talk1/R_talk2/R_slump/E_stern):
  stop-motion rep + flying handsets + ticks, silent meltdown beat with a wall smash, paddle gag, CTA bubble.
  Replace the DEMO scenes, times and CAPTIONS (search "EDIT"). Add an audio element for vo.wav (id vo, data-track-index 10) for the voiceover - see SKILL.md step 5.
  Run `new_project.sh` first so vendor/, fonts/, sfx/, sfx2/ and img/ exist.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="vendor/gsap.min.js"></script>
    <script src="vendor/motion-kit.js"></script>
    <script>window.__STATIC_AUDIO = true;</script>
    <script src="vendor/cutout-lib.js"></script>
    <script src="img/info.js"></script>
    <script src="sfx2/meta.js"></script>
    <style>
      @font-face { font-family: "Montserrat"; src: url("fonts/Montserrat-Variable.ttf") format("truetype"); font-weight: 100 900; font-display: block; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #111; }
      #stage { position: relative; width: 1080px; height: 1920px; overflow: hidden; }
      #anim { position: absolute; inset: 0; z-index: 10; overflow: hidden; }
      #world { position: absolute; inset: 0; width: 1080px; height: 1920px; overflow: hidden; }
      #grain { position: absolute; inset: 0; pointer-events: none; opacity: 0.1; mix-blend-mode: multiply;
        background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='300' height='300'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' seed='5'/><feColorMatrix values='0 0 0 0 0.5  0 0 0 0 0.5  0 0 0 0 0.5  0 0 0 0.55 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>"); }
      /* captions sit at the TOP (y 232) because the bottom half belongs to the characters; max 2 lines looks best */
      #caps { position: absolute; left: 0; right: 0; top: 232px; z-index: 30; }
      .cap { position: absolute; left: 50%; transform: translateX(-50%); width: max-content; max-width: 920px; text-align: center; line-height: 1.12;
        font-family: "Montserrat", sans-serif; font-weight: 800; font-size: 50px; color: #111; background: #fff; border: 5px solid #111; border-radius: 40px; padding: 10px 30px 14px; opacity: 0; }
    </style>
  </head>
  <body>
    <!-- EDIT: data-duration = voiceover length + ~1.5 s hold. Voiceover audio element goes inside #stage (see SKILL.md step 5). -->
    <div id="stage" data-composition-id="brandmotion" data-start="0" data-duration="10" data-fps="30" data-width="1080" data-height="1920">
      <div id="anim" class="clip" data-start="0" data-duration="10" data-track-index="2">
        <svg id="world" viewBox="0 0 1080 1920" xmlns="http://www.w3.org/2000/svg">
          <defs><clipPath id="mxClip"><circle cx="0" cy="0" r="300" /></clipPath></defs>
        </svg>
        <div id="grain"></div>
      </div>
      <div id="caps"></div>
<audio id="sfx-1" src="sfx/whoosh-short.mp3" data-start="3.367" data-duration="0.57" data-track-index="21" data-volume="0.22"></audio>
<audio id="sfx-2" src="sfx/whoosh-short.mp3" data-start="6.167" data-duration="0.57" data-track-index="22" data-volume="0.22"></audio>
<audio id="fx1" src="sfx2/ring_blip.wav" data-start="0.200" data-duration="0.2" data-track-index="31" data-volume="0.12"></audio>
<audio id="fx2" src="sfx2/ring_blip.wav" data-start="0.600" data-duration="0.2" data-track-index="32" data-volume="0.12"></audio>
<audio id="fx3" src="sfx2/ring_blip.wav" data-start="1.000" data-duration="0.2" data-track-index="33" data-volume="0.12"></audio>
<audio id="fx4" src="sfx2/ring_blip.wav" data-start="1.400" data-duration="0.2" data-track-index="34" data-volume="0.12"></audio>
<audio id="fx5" src="sfx2/ring_blip.wav" data-start="1.800" data-duration="0.2" data-track-index="35" data-volume="0.12"></audio>
<audio id="fx6" src="sfx2/ring_blip.wav" data-start="2.200" data-duration="0.2" data-track-index="36" data-volume="0.12"></audio>
<audio id="fx7" src="sfx2/ring_blip.wav" data-start="2.600" data-duration="0.2" data-track-index="37" data-volume="0.12"></audio>
<audio id="fx8" src="sfx2/ring.wav" data-start="0.300" data-duration="0.9" data-track-index="38" data-volume="0.5"></audio>
<audio id="sfx-3" src="sfx/pop.mp3" data-start="3.400" data-duration="0.72" data-track-index="23" data-volume="0.2"></audio>
<audio id="sfx-4" src="sfx/pop.mp3" data-start="3.900" data-duration="0.72" data-track-index="24" data-volume="0.22"></audio>
<audio id="fx9" src="sfx2/slap.wav" data-start="3.900" data-duration="0.14" data-track-index="39" data-volume="0.8"></audio>
<audio id="fx10" src="sfx/impact-bass-1.mp3" data-start="3.900" data-duration="0.5" data-track-index="40" data-volume="0.55"></audio>
<audio id="sfx-5" src="sfx/pop.mp3" data-start="5.200" data-duration="0.72" data-track-index="25" data-volume="0.22"></audio>
<audio id="fx11" src="sfx2/tick.wav" data-start="5.200" data-duration="0.3" data-track-index="41" data-volume="0.35"></audio>
<audio id="sfx-6" src="sfx/pop.mp3" data-start="6.300" data-duration="0.72" data-track-index="20" data-volume="0.2"></audio>
<audio id="sfx-7" src="sfx/pop.mp3" data-start="7.200" data-duration="0.72" data-track-index="21" data-volume="0.22"></audio>
<audio id="fx12" src="sfx/typing.mp3" data-start="7.200" data-duration="0.35" data-track-index="42" data-volume="0.4"></audio>
<audio id="fx13" src="sfx2/ding.wav" data-start="8.133" data-duration="0.7" data-track-index="43" data-volume="0.35"></audio>
<audio id="fx14" src="sfx/notification.mp3" data-start="8.133" data-duration="0.4" data-track-index="30" data-volume="0.4"></audio>
    </div>

    <script>
      (async function () {
        const tl = gsap.timeline({ paused: true });
        const K = MotionKit(tl, { stage: "#stage", fps: 30 });
        const { C, PROPS, svgEl, q } = K;
        const L = CutoutKit(tl, K, { silent: [[0, 10]] }); // EDIT: windows with no voice (silent gags) = SFX at full level
        const { item, inner, popIn, actor, pose, talk, jitter, enterStep, burst, draw, S2, SB } = L;

        L.scenes([["s1", 0, 3.4, "#E3241B"], ["s2", 3.4, 6.2, "#EDEDEB"], ["s3", 6.2, 10, "#E3241B"]]);

        // ---- scene 1 (hook): phone chaos, rep talks, handsets fly in from both sides
        actor("#s1", "r1", ["R_talk1", "R_talk2", "R_slump"], 540, 1880, 0.9, "R_talk1");
        jitter("r1", 0, 3.4, 3.5, 1.6, 1);
        talk("r1", "R_talk1", "R_talk2", 0, 3.2, 0.14);
        for (let k = 0; k < 7; k++) {
          const dir = k % 2 ? -1 : 1, y = 480 + (k % 4) * 150;
          const h = item("#s1", draw.handset(), dir > 0 ? -150 : 1230, y, 0.9);
          tl.fromTo(h, { x: dir > 0 ? -150 : 1230, rotation: dir * -20 }, { x: dir > 0 ? 1230 : -150, rotation: dir * 20, duration: 0.8, ease: "steps(10)", immediateRender: false }, q(0.2 + k * 0.4));
          S2("ring_blip", 0.2 + k * 0.4, 0.12);
        }
        S2("ring", 0.3, 0.5);
        pose("r1", "R_slump", 3.1);

        // ---- scene 2: STOP slams in, calls vanish, rep relaxes
        actor("#s2", "r2", ["R_slump", "R_talk1", "R_talk2"], 540, 1880, 0.9, "R_slump");
        jitter("r2", 3.4, 6.2, 3, 1.4, 11);
        enterStep("r2", 3.4, 0, 400, 0.4, 5);
        popIn(item("#s2", draw.stop(), 540, 680, 1.5), 3.9);
        S2("slap", 3.9, 0.8); SB("impact-bass-1", 0.5, 3.9, 0.55);
        talk("r2", "R_talk1", "R_talk2", 4.6, 5.9, 0.16);
        popIn(item("#s2", draw.tick(), 800, 1250, 1.3), 5.2); S2("tick", 5.2, 0.35);

        // ---- scene 3: end — exec approves, CTA bubble
        actor("#s3", "ex", ["E_stern"], 540, 1900, 0.98, "E_stern");
        jitter("ex", 6.2, 10, 3, 1.2, 31);
        enterStep("ex", 6.3, 0, 400, 0.45, 5);
        const bubble = item("#s3", draw.ctaBubble("HUSH"), 540, 640, 3.2);
        popIn(bubble, 7.2);
        SB("typing", 0.35, 7.2, 0.4);
        tl.to("#dots", { opacity: 0.25, duration: 0.1, yoyo: true, repeat: 3 }, 7.3);
        tl.set("#dots", { opacity: 0 }, 8.1);
        tl.fromTo("#trustTxt", { opacity: 0, scale: 0.4 }, { opacity: 1, scale: 1, duration: 0.4, ease: "steps(5)", svgOrigin: "0 0", immediateRender: false }, 8.12);
        S2("ding", 8.12, 0.35); SB("notification", 0.4, 8.12, 0.4);

        L.captions([
          [0.0, 3.3, "Phone never stops ringing?"],
          [3.9, 6.1, "Hush blocks the spam calls."],
          [8.1, 10.0, "Message me the word “Hush”"],
        ]);

        window.__timelines = window.__timelines || {};
        window.__timelines["brandmotion"] = tl;
        tl.seek(0);
      })();
    </script>
  </body>
</html>
